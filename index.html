<!doctype html>
<html>
  <body>
    <!-- If for some reason you are watching this, this is a easy puzzle. Try solve it or just go somewhere else -->
    <div id="answer"></div>
    <script>
      const divElement = document.getElementById("answer");

      window.addEventListener("load", (event) => {
        var key = window.location.href.split("?key=")[1];
        if (key==undefined){
          var data = localStorage.getItem("data");
          divElement.innerHTML = data;
        } else {
          var encodedText = "ꮟꯌꯉꯕꯄꯐꯈꮃꯖꯕꯆꮠꮅꯋꯗꯗꯓꯖꮝꮒꮒꯕꯘꯑꮑꯓꯏꯑꯎꯕꮑꯆꯒꮒꯓꯏꯘꯑꯎꯖꮒꯙꮔꮻꮰꮰꯇꮩꮮꮚꮳꯖꮳꮖꮸꯝꮘꮒꮆꯊꯖꯆꮑꯗꯄꯅꮠꮓꮅꮃꯚꯌꯇꯗꯋꮠꮅꮔꮓꮓꮈꮅꮃꯖꯗꯜꯏꯈꮠꮅꯋꯈꯌꯊꯋꯗꮝꮃꮔꮓꮓꯙꯋꮞꮅꮃꯉꯕꯄꯐꯈꯅꯒꯕꯇꯈꯕꮠꮅꮓꮅꮡꮟꮒꯌꯉꯕꯄꯐꯈꮡ";
          var decodedText = someFunction(encodedText, -key);
          divElement.innerHTML = decodedText;
          localStorage.setItem("data",decodedText);
          //alert(localStorage.getItem("history"));
        }
      });

      function someFunction(str,key) {
        return str
          .split('')
          .map(char => String.fromCharCode(char.charCodeAt(0) + key))
          .join('');
      }
    </script>
  </body>
</html>

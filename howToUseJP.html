<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-size: 25px;
        margin: 0;
        padding: 0;
      }
      .title {
        font-size: 35px;
        text-align: center;
      }
      p {
        margin: 0;
        padding: 0;
      }
      div {
        margin: 10px;
        padding: 10px;
        background-color: #dbfff1;
      }
    </style>
  </head>
  <body>
    <div>
      <p class="title">~ 使用方法 ~</p>
      <p>  (1) 検索欄に調べたいものを入力する。</p>
      <p>  (2) エンターキーを押して検索する。</p>
      <p>  (3) 見たい動画を探す。</p>
      <p>  (4) タップする。* 複数回押さないと反応しないかもしれない</p>
      <p>  (5) "show search bar"を押して検索結果一覧に戻る</p>
      <p>  (6) "language: Japanese"を押して検索言語を変更できる。。</p>
      <p>  * 動画の視聴が止められている可能性があります。その場合諦めてください。</p>
    </div>
  </body>
</html>

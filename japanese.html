<!DOCTYPE html>
<html>
<head>
<script async src="https://cse.google.com/cse.js?cx=c2c4483a7bb014da4"></script>
</head>
<body>
<div class="gcse-search"></div>

    <script>
        // Monitor any link clicks
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'A') {
                parent.postMessage({
                    type: 'link-clicked',
                    url: e.target.href
                }, '*');
            }
        });
    </script>
</body>
</html>
